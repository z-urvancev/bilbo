name: GitHub Pages

on:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Cancel stale Pages deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          stale_deployment_id=$(curl --silent --show-error --fail --location \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            'https://api.github.com/repos/${{ github.repository }}/actions/jobs/109524303250/logs' \
            | sed -n 's/.*Created deployment for dd071fed012c0579c6204403fd99065ec6b0e7f8, ID: \([^[:space:]]*\).*/\1/p' \
            | tail -n 1)
          if [ -z "$stale_deployment_id" ]; then
            echo 'Could not recover the stale Pages deployment ID.'
            exit 1
          fi
          echo "Cancelling stale Pages deployment $stale_deployment_id"
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/${{ github.repository }}/pages/deployments/$stale_deployment_id/cancel")
          if [ "$status" != '204' ] && [ "$status" != '404' ]; then
            echo "Unexpected response while cancelling stale deployment: HTTP $status"
            exit 1
          fi
          if [ "$status" = '204' ]; then
            for attempt in {1..30}; do
              deployment_status=$(curl --silent --show-error \
                --header 'Accept: application/vnd.github+json' \
                --header "Authorization: Bearer $GITHUB_TOKEN" \
                --header 'X-GitHub-Api-Version: 2026-03-10' \
                "https://api.github.com/repos/${{ github.repository }}/pages/deployments/$stale_deployment_id" \
                | jq --raw-output '.status // "unknown"')
              echo "Stale deployment status: $deployment_status"
              if [ "$deployment_status" != 'in_progress' ] && [ "$deployment_status" != 'queued' ]; then
                break
              fi
              sleep 2
            done
            if [ "$deployment_status" = 'in_progress' ] || [ "$deployment_status" = 'queued' ]; then
              echo 'Stale deployment did not stop in time.'
              exit 1
            fi
          fi
      - id: deployment
        uses: actions/deploy-pages@v4
